<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="two finger tap gesture"><style>svg{--cycle:5s;--window:#FFFFFF;--window-stroke:rgba(0,0,0,0.10);--titlebar:#F0F0F3;--line:#D5D5DB;--line2:#E6E6EB;--accent:#0A84FF;--finger:rgba(28,28,30,0.30);--finger-ring:#FFFFFF;--menu:#FFFFFF;--dim:rgba(0,0,0,0.18);--kb:#D1D3D9;--key:#FFFFFF;--key-down:#A6ABB5;--sky:#8EC5FF;--sun:#FFCF4D;--hill:#58B984;--hill2:#2F8F5B;--menubar:rgba(255,255,255,0.55);--label-text:#1D1D1F}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes smenu{0.000%{opacity:0;transform:scale(.9)}17.000%{opacity:0;transform:scale(.9);animation-timing-function:cubic-bezier(0.4,0,0.2,1)}22.000%{opacity:1;transform:scale(1)}76.000%{opacity:1;transform:scale(1)}82.000%{opacity:0;transform:scale(1)}100.000%{opacity:0;transform:scale(1)}}.smenu{animation:smenu var(--cycle) linear infinite;transform-box:fill-box;transform-origin:0 0;}@keyframes shl{0.000%{opacity:0}34.000%{opacity:0}38.000%{opacity:1}100.000%{opacity:1}}.shl{animation:shl var(--cycle) linear infinite;}@keyframes sfa{0.000%{transform:translate(0px,0px) scale(1);opacity:0;animation-timing-function:cubic-bezier(0.4,0,0.2,1)}8.000%{transform:translate(0px,0px) scale(1.15);opacity:0;animation-timing-function:cubic-bezier(0.4,0,0.2,1)}11.000%{transform:translate(0px,0px) scale(1);opacity:1;animation-timing-function:cubic-bezier(0.4,0,0.2,1)}14.000%{transform:translate(0px,0px) scale(0.82);opacity:1;animation-timing-function:cubic-bezier(0.4,0,0.2,1)}17.000%{transform:translate(0px,0px) scale(1);opacity:1;animation-timing-function:cubic-bezier(0.4,0,0.2,1)}21.000%{transform:translate(0px,0px) scale(1.1);opacity:0;animation-timing-function:cubic-bezier(0.4,0,0.2,1)}100.000%{transform:translate(0px,0px) scale(1.1);opacity:0}}.sfa{animation:sfa var(--cycle) linear infinite;transform-box:fill-box;transform-origin:center;}@keyframes sfb{0.000%{transform:translate(0px,0px) scale(1);opacity:0;animation-timing-function:cubic-bezier(0.4,0,0.2,1)}8.000%{transform:translate(0px,0px) scale(1.15);opacity:0;animation-timing-function:cubic-bezier(0.4,0,0.2,1)}11.000%{transform:translate(0px,0px) scale(1);opacity:1;animation-timing-function:cubic-bezier(0.4,0,0.2,1)}14.000%{transform:translate(0px,0px) scale(0.82);opacity:1;animation-timing-function:cubic-bezier(0.4,0,0.2,1)}17.000%{transform:translate(0px,0px) scale(1);opacity:1;animation-timing-function:cubic-bezier(0.4,0,0.2,1)}21.000%{transform:translate(0px,0px) scale(1.1);opacity:0;animation-timing-function:cubic-bezier(0.4,0,0.2,1)}100.000%{transform:translate(0px,0px) scale(1.1);opacity:0}}.sfb{animation:sfb var(--cycle) linear infinite;transform-box:fill-box;transform-origin:center;}</style><defs><linearGradient id="swalla" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A9C8FF"/><stop offset="1" stop-color="#E6D6FF"/></linearGradient><linearGradient id="swallb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD0B0"/><stop offset="1" stop-color="#FFB3C6"/></linearGradient><filter id="sshadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity=".35"/></filter><clipPath id="sscreen"><rect width="300" height="200" rx="10"/></clipPath></defs><rect width="320" height="220" rx="16" fill="#F5F5F7"/><g transform="translate(10 10)"><g clip-path="url(#sscreen)"><rect x="0" y="0" width="300" height="200" fill="url(#swalla)"/><rect x="0" y="0" width="300" height="9" fill="var(--menubar)"/><rect x="8" y="3" width="4" height="3" rx="1" fill="var(--window)" opacity=".8"/><rect x="17" y="3" width="14" height="3" rx="1.5" fill="var(--window)" opacity=".6"/><rect x="36" y="3" width="10" height="3" rx="1.5" fill="var(--window)" opacity=".6"/><g class=""><rect x="40" y="30" width="220" height="148" rx="7" fill="var(--window)" stroke="var(--window-stroke)"/><path d="M40 37a7 7 0 0 1 7 -7h206a7 7 0 0 1 7 7v9h-220z" fill="var(--titlebar)"/><